<script>
// WARNING: Only use this frontend approach for local testing. 
// For production, move the API call to a backend server to protect your key.
const API_KEY = "PASTE_YOUR_OPENAI_API_KEY"; 

const chat = document.getElementById("chat");
const inputField = document.getElementById("question");

// Allow user to press "Enter" to send the message
inputField.addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    askAI();
  }
});

function addMessage(text, type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight; // Auto-scroll to bottom
}

async function askAI(){
  const question = inputField.value.trim();
  if(!question) return;

  addMessage("You: " + question, "user");
  inputField.value = "";

  try {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: "gpt-4o-mini", // Fixed model name
        messages: [
          {
            role: "system",
            content: "You are a friendly NEET teacher who explains concepts simply. Keep your answers concise so they are easy to listen to."
          },
          {
            role: "user",
            content: question
          }
        ]
      })
    });

    if (!response.ok) {
      throw new Error("API responded with an error");
    }

    const data = await response.json();
    const reply = data.choices[0].message.content;

    addMessage("Teacher: " + reply, "bot");
    speak(reply);

  } catch(err) {
    console.error(err);
    addMessage("Teacher: Sorry, I couldn't connect to the AI right now.", "bot");
  }
}

function speak(text){
  // Stop any currently playing audio before starting new speech
  window.speechSynthesis.cancel(); 

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speech.rate = 1;
  speech.pitch = 1;
  window.speechSynthesis.speak(speech);
}

function startVoice(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (!SpeechRecognition) {
    alert("Sorry, your browser doesn't support voice recognition.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.start();

  recognition.onresult = function(event){
    const transcript = event.results[0][0].transcript;
    inputField.value = transcript;
    askAI();
  };
}
</script>
